<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>    
    <script src="js/script.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>

  <!-- navbar -->
<nav class="bg-white border-gray-200 dark:bg-gray-700 sticky top-0 z-50">
  <div class="max-w-screen flex flex-wrap items-center justify-between mx-auto p-3">
      <img src="css/profilepic.jpg" class="h-15 rounded-full" alt="Flowbite Logo" />
    <button data-collapse-toggle="navbar-default" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-600 dark:focus:ring-gray-600" aria-controls="navbar-default" aria-expanded="false">
      <span class="sr-only">Open main menu</span>
      <svg class="w-4 h-4" aria-hidden="true" fill="none" viewBox="0 0 17 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15" />
      </svg>
    </button>
    <div class="hidden w-full md:block md:w-auto" id="navbar-default">
      <ul
        class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-700 dark:border-gray-700">
        <li>
          <a href="#" class="block py-2 px-3 text-white bg-blue-700 rounded-sm md:bg-transparent md:text-blue-700 md:p-0 dark:text-white md:dark:text-blue-500" aria-current="page">Home</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Our profile</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Portofolio</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Message us</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
</header>
<hr>

<!-- intro -->
<div class="container mx-auto p-4">
  <div class="group bg-amber-400 mr-60">
    <div class="hidden group-hover:block ">
      <p class="z-[2] p-0.5 ml-35 absolute bg-green-500 rounded-xl border-2 border-green-700">click to insert your name</p>
    </div>
    <h1 class="text-2xl font-bold"><a href="#" class="popup-btn hover:text-blue-800">Hello Guest</a></h1>
  </div>
    <h1 class="text-2xl font-bold"> Welcome to my Website</h1>
    <p class="text-gray-700 z-[1]">This is a website built for the RevoU Mini Coding Project.</p>
</div>

<!-- if you have a name, insert it in this pop up -->
<div class="popup-wrap hidden w-full h-full absolute top-0 left-0 bg-black/50">
    <div class="popup-box absolute top-1/2 left-1/2 bg-white text-center shadow-lg rounded w-[400px] transform -translate-x-1/2 -translate-y-1/2">
      <h2 class="font-bold p-4 mb-4 bg-gray-200">Enter your name here</h2>
      <label for="">Hello</label>
      <input type="text" class="border p-2 rounded w-[50%] mb-4" placeholder="Your name...">
      <hr>
      <br>
      <button class="close-btn popup-close p-4 border-2 mb-5 bg-gray-300 border-gray-500 hover:bg-gray-400 rounded py-2" href="#">Submit</button>
    </div>
  </div>
<hr>



<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Portofolio</h1>
</div>
<hr>

<!-- contact form -->
<div class="container mx-auto p-4">
  <form action="">
    <div class="mb-4">
      <label for="name" class="block text-gray-700">Name:</label>
      <input type="text" id="name" name="name" class="w-full p-2 border border-gray-300 rounded" required>
    </div>
    <div class="mb-4">
      <label for="email" class="block text-gray-700">Email:</label>
      <input type="email" id="email" name="email" class="w-full p-2 border border-gray-300 rounded" required>
    <div class="mb-4">
      <label for="message" class="block text-gray-700">Message:</label>
      <textarea id="message" name="message" rows="4" class="w-full p-2 border border-gray-300 rounded"></textarea>
    </div>
    <button type="submit" class="bg-gray-300 border-2 border-gray-500 px-4 py-2 rounded hover:bg-gray-400">Submit</button>
  </form>
</div>
</body>
</html>
